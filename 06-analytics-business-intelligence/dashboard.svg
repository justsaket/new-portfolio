<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980"><rect width="1600" height="980" fill="#071018"/><g font-family="Arial"><text x="70" y="65" fill="#F4F7FA" font-size="30" font-weight="700">ANALYTICS &amp; BUSINESS INTELLIGENCE</text><text x="70" y="95" fill="#8293A3" font-size="14">CUSTOMER VALUE • WORKFORCE • FINANCE • FUND RESEARCH</text><g fill="#101D27"><rect x="70" y="140" width="330" height="125" rx="14"/><rect x="420" y="140" width="330" height="125" rx="14"/><rect x="770" y="140" width="330" height="125" rx="14"/><rect x="1120" y="140" width="410" height="125" rx="14"/></g><g fill="#8293A3" font-size="12"><text x="95" y="175">CUSTOMER VALUE</text><text x="445" y="175">WORKFORCE</text><text x="795" y="175">FINANCE</text><text x="1145" y="175">FUND RESEARCH</text></g><g fill="#F4F7FA" font-size="29" font-weight="700"><text x="95" y="220">₹447K</text><text x="445" y="220">5 EMP.</text><text x="795" y="220">16.55%</text><text x="1145" y="220">14.8%</text></g><g fill="#5CC8A1" font-size="12"><text x="95" y="245">sample customer value</text><text x="445" y="245">workforce snapshot</text><text x="795" y="245">Aug operating margin</text><text x="1145" y="245">sample return</text></g><rect x="70" y="300" width="940" height="300" rx="14" fill="#0D1821"/><text x="95" y="340" fill="#F4F7FA" font-size="17" font-weight="700">VALUE + PERFORMANCE MATRIX</text><line x1="115" y1="555" x2="955" y2="555" stroke="#2A3A46"/><line x1="535" y1="375" x2="535" y2="555" stroke="#2A3A46"/><circle cx="730" cy="425" r="13" fill="#5CC8A1"/><circle cx="655" cy="460" r="13" fill="#5CC8A1"/><circle cx="410" cy="485" r="13" fill="#D6A84F"/><circle cx="350" cy="515" r="13" fill="#D6A84F"/><text x="120" y="580" fill="#8293A3" font-size="11">LOW VALUE / LOWER PERFORMANCE</text><text x="760" y="580" fill="#8293A3" font-size="11">HIGH VALUE / HIGHER PERFORMANCE</text><rect x="1040" y="300" width="490" height="300" rx="14" fill="#0D1821"/><text x="1065" y="340" fill="#F4F7FA" font-size="17" font-weight="700">RISK &amp; DRIVER BOARD</text><text x="1065" y="385" fill="#B8C5CF" font-size="14">CUSTOMER</text><text x="1065" y="412" fill="#8293A3" font-size="12">At-risk segment requires retention investigation</text><text x="1065" y="455" fill="#B8C5CF" font-size="14">HR</text><text x="1065" y="482" fill="#8293A3" font-size="12">Compare tenure, overtime and satisfaction</text><text x="1065" y="525" fill="#B8C5CF" font-size="14">FINANCE</text><text x="1065" y="552" fill="#8293A3" font-size="12">Monitor margin alongside revenue growth</text><rect x="70" y="640" width="1460" height="250" rx="14" fill="#0D1821"/><text x="95" y="680" fill="#F4F7FA" font-size="17" font-weight="700">EXECUTIVE INSIGHT LAYER</text><text x="95" y="725" fill="#B8C5CF" font-size="14">Customer → identify high-value and at-risk segments before allocating retention resources.</text><text x="95" y="765" fill="#B8C5CF" font-size="14">HR → investigate workforce patterns by department and employee attributes.</text><text x="95" y="805" fill="#B8C5CF" font-size="14">Finance → connect top-line growth with gross and operating profitability.</text><text x="95" y="845" fill="#B8C5CF" font-size="14">Funds → compare return with volatility and drawdown instead of using return alone.</text></g></svg>